name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository and uploads test artifacts; it never
# needs write access, so pin the token to read.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static syntax check
        run: python -m compileall -q app tests

      - name: Isolated test suite
        run: python -m pytest tests -q

      - name: Migration integrity (fresh DB, single head)
        # Fresh disposable SQLite database: no application/developer database is
        # ever used. Verifies migrations 001 -> head apply cleanly and that the
        # chain has exactly one head (currently documented as 009_closures).
        # Importing app.db.database requires SECRET_KEY/ADMIN_PASSWORD, so
        # disposable CI-only values are supplied here (never used in production).
        env:
          DATABASE_URL: sqlite:////tmp/casaaurelia_ci_migration.db
          SECRET_KEY: ci-only-non-secret-key-0123456789abcdef
          ADMIN_PASSWORD: ci-only-admin-password-123
        run: |
          rm -f /tmp/casaaurelia_ci_migration.db*
          python -m alembic upgrade head
          heads=$(python -m alembic heads)
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c '(head)')" -ne 1 ]; then
            echo "Expected exactly one Alembic head, got:" >&2
            printf '%s\n' "$heads" >&2
            exit 1
          fi
          rm -f /tmp/casaaurelia_ci_migration.db*

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (specs)
        run: npm test

      - name: Type-check & build
        run: npm run build

  e2e:
    name: Playwright E2E (Chromium + cross-browser smoke)
    runs-on: ubuntu-latest
    env:
      # E2E credentials come ONLY from CI secrets (never committed, never
      # defaulted). run_e2e.py fails clearly when either is missing/empty, so an
      # unconfigured runner cannot silently produce a green/weak result.
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (E2E launcher)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E suite (Chromium primary)
        working-directory: frontend
        run: npx playwright test

      - name: Cross-browser smoke (Chromium, Firefox, WebKit)
        working-directory: frontend
        run: npx playwright test --config=playwright.crossbrowser.config.ts --project=chromium --project=firefox --project=webkit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7